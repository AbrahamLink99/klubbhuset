name: Testa flöden

# Hämtar alla flöden och visar vilka som svarar. Körs automatiskt när källistan
# ändras, och kan startas för hand under Actions. Behöver inga nycklar och skriver
# inget i databasen.
on:
  push:
    paths: ["sources.yaml", "players.yaml", ".github/workflows/testa-floden.yml"]
  workflow_dispatch: {}

jobs:
  testa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: motor/requirements.txt
      - run: pip install -r motor/requirements.txt
      - name: Testa alla flöden
        working-directory: motor
        run: python -m klubbhuset_motor.run --check-feeds
