name: Tester

on:
  push:
    branches: [main]
    paths: ["motor/**", "sources.yaml", "players.yaml", ".github/workflows/tester.yml"]
  workflow_dispatch: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: motor/requirements.txt
      - run: pip install -r motor/requirements.txt pytest
      - name: Kör testerna
        working-directory: motor
        run: python -m pytest -q
